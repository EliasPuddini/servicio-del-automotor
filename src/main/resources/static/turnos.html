<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos</title>
    <link rel="stylesheet" href="css/turnos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="./img/servicio.jpg">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .table-dark {
            background-color: #1e1e1e;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Servicio Automotor</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="./clients.html">Clientes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./turnos.html">Turnos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <h2 class="text-center">Lista de Turnos</h2>
        <div class="table-responsive">
            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nombre de Cliente</th>
                        <th>DNI</th>
                        <th>Patente</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Precio</th>
                        <th>Servicios</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="turno in turnosFiltrados" :key="turno.id">
                        <td>{{ turno.id }}</td>
                        <td>{{ turno.cliente.nombre }}</td>
                        <td>{{ turno.cliente.dni }}</td>
                        <td>{{ turno.patente }}</td>
                        <td>{{ turno.fecha }}</td>
                        <td>{{ turno.hora }}</td>
                        <td>{{ turno.precio }}</td>
                        <td>{{ turno.servicio }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="text-center mt-4">
            <button class="btn btn-primary btn-lg">Agregar Turno</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/turnos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

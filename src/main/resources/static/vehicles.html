<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="icon" href="./img/servicio.jpg">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .table-dark {
            background-color: #1e1e1e;
        }
        .btn-floating {
            position: fixed;
            bottom: 20px;
            right: 20px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
        .modal-content {
            background-color: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Servicio Automotor</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="./clients.html">Clientes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./orders.html">Turnos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./vehicles.html">Vehiculos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div id="app" class="container mt-4">

        <h2 class="text-center">Lista de Marcas y modelos</h2>
        <!-- Tabla de Clientes -->
        <div class="table-responsive">
            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th><button class="btn btn-success" @click="openModel"><i class="bi bi-plus-circle"></i> Agregar</button></th>
                    </tr>
                </thead>
                <tbody class="table-primary text-dark">
                    <tr v-if="models.length > 0" v-for="model in models" :key="model.id">
                        <td>{{model.brand.name}}</td>
                        <td>{{model.name}}</td>
                        <td><button class="btn btn-warning me-2" @Click="deleteModel(model.id)"><i class="bi bi-pencil-square"></i> Eliminar</button></td>
                    </tr>
                    <tr v-else>
                        <td colspan="5" class="text-center text-light">Cargando marcas y modelos...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Modal para agregar modelos y marcas -->
        <div v-if="modelModal" class="modal fade show d-block" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-light">
                    <div class="modal-header">
                        <h5 class="modal-title">Agregar Modelo</h5>
                        <button @click="closeModel" type="button" class="btn-close"></button>
                    </div>
                    <div class="modal-body">
                        <form @submit.prevent="postModel">
                            <div class="mb-3">
                                <label for="vehicleBrand" class="form-label">Marca</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" v-model="nuevaMarcaHabilitada" id="addNewBrand">
                                    <label class="form-check-label" for="addNewBrand">
                                        Agregar nueva marca
                                    </label>
                                </div>
                            
                                <select v-if="!nuevaMarcaHabilitada" class="form-control" v-model="nuevoModelo.brand" required>
                                    <option v-for="brand in brands" :key="brand.id" :value="brand">{{ brand.name }}</option>
                                </select>
                            
                                <input v-else type="text" v-model="nuevaMarca" class="form-control" placeholder="Ingrese nueva marca" required>
                            </div>
                            <div class="mb-3">
                                <label for="vehicleModel" class="form-label">Modelo</label>
                                <input type="text" v-model="nuevoModelo.name" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>



    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="js/vehicles.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Clientes | Servicio Automotor</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/clients.css">
    <link rel="icon" href="./img/servicio.jpg">
    
    <style>
        body {
            background-color: #121212;
            color: #f8f9fa;
        }
        .table thead {
            background-color: #007bff;
            color: white;
        }
        .btn-floating {
            position: fixed;
            bottom: 20px;
            right: 20px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Servicio Automotor</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="./clients.html">Clientes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./orders.html">Turnos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Vue App -->
    <div id="app" class="container mt-4">
        <!-- Mensaje de respuesta con Bootstrap -->
        <div v-if="mensaje" class="alert" :class="alertClass" role="alert">
            {{ mensaje }}
        </div>

        
        <h2 class="text-center">Lista de Clientes</h2>
        <!-- Tabla de Clientes -->
        <div class="table-responsive">
            <table class="table table-dark table-hover text-center">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo de Documento</th>
                        <th>Documento</th>
                        <th>Tipo Usuario</th>
                        <TH></TH>
                    </tr>
                </thead>
                <tbody class="table-primary text-dark">
                    <tr v-if="clientes.length > 0" v-for="cliente in clientes" :key="cliente.id">
                        <td>{{cliente.name}}</td>
                        <td>{{cliente.document.documentType.name}}</td>
                        <td>{{cliente.document.value}}</td>
                        <td>{{cliente.clientType.name}}</td>
                        <td>
                            <a :href="'client.html?id=' + cliente.id" class="btn btn-info">Info</a>
                        </td>
                    </tr>
                    <tr v-else>
                        <td colspan="5" class="text-center text-light">Cargando clientes...</td>
                    </tr>
                </tbody>
                
                
            </table>
            
        </div>
            
        <!-- Botón flotante para agregar cliente -->
        <button class="btn btn-primary btn-floating" @click="abrirModal">+</button>

        <!-- Modal para agregar cliente -->
        <div v-if="mostrarModal" class="modal fade show d-block" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-light">
                    <div class="modal-header">
                        <h5 class="modal-title">Ingresar un Cliente</h5>
                        <button type="button" class="btn-close btn-close-white" @click="cerrarModal"></button>
                    </div>
                    <div class="modal-body">
                        <form @submit.prevent="postearDatos">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" v-model="nuevoCliente.name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tipo de Documento</label>
                                <select v-model="nuevoCliente.document.documentType.name" class="form-control" required>
                                    <option value="DNI">DNI</option>
                                    <option value="CUIT">CUIT</option>
                                    <option value="CUIL">CUIL</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Número de Documento</label>
                                <input type="text" v-model="nuevoCliente.document.value" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" v-model="nuevoCliente.user.userName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" v-model="nuevoCliente.user.password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" @onClick>Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/clients.js"></script>
</body>
</html>

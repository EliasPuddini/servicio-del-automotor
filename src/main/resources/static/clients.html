<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Clientes | Servicio Automotor</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/clients.css">
    <link rel="icon" href="./img/servicio.jpg">
    
    <style>
        body {
            background-color: #121212; /* Fondo oscuro */
            color: #f8f9fa; /* Texto claro */
        }
        .table thead {
            background-color: #007bff; /* Azul Bootstrap */
            color: white;
        }
        .btn-floating {
            position: fixed;
            bottom: 20px;
            right: 20px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Servicio Automotor</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="./clients.html">Clientes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./turnos.html">Turnos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Vue App -->
    <div id="app" class="container mt-4">
        
        <!-- Tabla de Clientes -->
        <div class="table-responsive">
            <table class="table table-dark table-hover text-center">
                <thead>
                    <tr>
                        <th colspan="2">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="me-2">Buscar por DNI:</label>
                                <input type="text" v-model="buscadorDNI" @input="filtrar" class="form-control w-50">
                            </div>
                        </th>
                        <th colspan="3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="me-2">Buscar por Nombre:</label>
                                <input type="text" v-model="buscadorNombre" @input="filtrar" class="form-control w-50">
                            </div>
                        </th>
                    </tr>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>DNI</th>
                        <th>Tipo de Cliente</th>
                    </tr> 
                </thead>
                <tbody class="table-primary text-dark">
                    <tr v-for="cliente in clientesFiltrados" :key="cliente.id">
                        <td>{{cliente.id}}</td>
                        <td>{{cliente.nombre}}</td>
                        <td>{{cliente.dni}}</td>
                        <td>{{cliente.tipoCliente}}</td>
                        <td>{{cliente.serviciosPrevios}}</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Botón flotante para agregar cliente -->
    <button class="btn btn-primary btn-floating" data-bs-toggle="modal" data-bs-target="#agregarClienteModal">+</button>

    <!-- Modal para agregar cliente -->
    <div class="modal fade" id="agregarClienteModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Ingresar un Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form @submit.prevent="postearDatos">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" v-model="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">DNI</label>
                            <input type="text" v-model="dni" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/clients.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
